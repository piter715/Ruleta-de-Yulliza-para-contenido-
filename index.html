<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Ruleta de Yulliza</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    *{font-family:'Outfit',sans-serif}
    @keyframes fall {
      0%{transform:translateY(-20vh) rotate(0deg) translateX(0); opacity:1}
      100%{transform:translateY(110vh) rotate(720deg) translateX(60px); opacity:0}
    }
    @keyframes pop {
      0%{transform:scale(0.8); opacity:0}
      60%{transform:scale(1.08); opacity:1}
      100%{transform:scale(1); opacity:1}
    }
    @keyframes neonPulse {
      0%,100%{filter:drop-shadow(0 0 6px #ff8ec8) drop-shadow(0 0 18px #ff5ab0) drop-shadow(0 0 32px #ff2a8a)}
      50%{filter:drop-shadow(0 0 10px #ffc2e3) drop-shadow(0 0 26px #ff8ec8) drop-shadow(0 0 42px #ff5ab0)}
    }
    @keyframes floatBadge {
      0%,100%{transform:translateY(0) rotate(-6deg)}
      50%{transform:translateY(-4px) rotate(-4deg)}
    }
  </style>
</head>
<body class="min-h-screen w-full bg-[#0e0a14] flex flex-col items-center px-4 py-6 sm:py-8 relative overflow-hidden selection:bg-[#ff5ab0]/30">
  <!-- Background glows -->
  <div class="pointer-events-none absolute inset-0">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_50%_0%,rgba(255,90,176,0.28),transparent_55%),radial-gradient(ellipse_at_50%_100%,rgba(255,194,227,0.18),transparent_60%),radial-gradient(ellipse_at_15%_30%,rgba(255,142,200,0.12),transparent_50%)]"></div>
    <div class="absolute top-[-20%] left-1/2 -translate-x-1/2 w-[120%] h-[70%] bg-[#ff5ab0]/[0.08] blur-[80px] rounded-full"></div>
  </div>

  <!-- Title - Solo La Ruleta de Yulliza -->
  <div class="relative z-10 w-full max-w-[520px] flex flex-col items-center gap-2">
    <h1 class="text-[36px] sm:text-[48px] font-black tracking-tight leading-none text-center" style="color:#ffc2e3; text-shadow:0 0 8px #ff8ec8, 0 0 18px #ff5ab0, 0 0 32px #ff2a8a, 0 0 2px #fff; animation:neonPulse 2.8s ease-in-out infinite">
      La Ruleta de Yulliza
    </h1>
    <p class="text-[11px] tracking-[0.2em] text-white/50 font-semibold">GIRA Y GANA TU PREMIO ♡</p>
  </div>

  <!-- Ruleta -->
  <div class="relative z-10 mt-8 sm:mt-10 w-full max-w-[420px]">
    <!-- Flecha -->
    <div class="absolute -top-[14px] left-1/2 -translate-x-1/2 z-30 flex flex-col items-center">
      <div class="w-0 h-0" style="border-left:18px solid transparent; border-right:18px solid transparent; border-top:28px solid white; filter:drop-shadow(0 2px 0 #ff5ab0) drop-shadow(0 0 8px rgba(255,90,176,0.8))"></div>
      <div class="w-3 h-3 -mt-1 bg-white rounded-full border-2 border-[#ff5ab0] shadow-[0_0_10px_rgba(255,90,176,0.8)]"></div>
    </div>
    
    <div class="absolute inset-0 -m-6 bg-gradient-to-br from-[#ff8ec8]/20 via-[#ff5ab0]/20 to-[#ff2a8a]/20 blur-[30px] rounded-full"></div>
    
    <div id="wheel" class="relative aspect-square w-full rounded-full overflow-hidden shadow-[0_0_0_6px_rgba(255,255,255,0.9),0_0_0_10px_#ff5ab0,0_0_50px_rgba(255,90,176,0.6),inset_0_0_40px_rgba(0,0,0,0.25)]" style="will-change:transform">
      <svg viewBox="0 0 400 400" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff"></stop>
            <stop offset="55%" stop-color="#ffc2e3"></stop>
            <stop offset="100%" stop-color="#ff5ab0"></stop>
          </radialGradient>
          <filter id="softShadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/></filter>
          <filter id="winGlow">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="white" flood-opacity="0.9"/>
            <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#ff5ab0" flood-opacity="0.8"/>
          </filter>
        </defs>
        <g id="segments"></g>
        <g id="labels"></g>
        <circle cx="200" cy="200" r="48" fill="white" stroke="#ff5ab0" stroke-width="3" filter="url(#softShadow)"></circle>
        <circle cx="200" cy="200" r="38" fill="url(#centerGrad)"></circle>
        <circle cx="200" cy="200" r="28" fill="white" opacity="0.9"></circle>
        <text x="200" y="200" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="900" fill="#ff2a8a">♡</text>
      </svg>
    </div>

    <!-- Puntitos alrededor -->
    <div id="dots" class="pointer-events-none absolute inset-0 rounded-full"></div>
  </div>

  <!-- Boton y estado -->
  <div class="relative z-10 mt-8 sm:mt-10 w-full max-w-[320px] flex flex-col items-center gap-4">
    <button id="spinBtn" class="group relative w-full py-4 px-8 rounded-full bg-gradient-to-br from-[#ffc2e3] via-[#ff8ec8] to-[#ff2a8a] text-white font-black tracking-[0.08em] text-[15px] sm:text-[16px] shadow-[0_8px_28px_rgba(255,42,138,0.55),0_0_0_2px_white] active:scale-[0.98] disabled:opacity-60 disabled:active:scale-100 transition-all overflow-hidden">
      <span class="absolute inset-0 bg-gradient-to-r from-transparent via-white/30 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-700"></span>
      <span id="spinText" class="relative flex items-center justify-center gap-2">TOCA PARA GIRAR ✦</span>
    </button>
    
    <div id="usedMessage" class="hidden w-full text-center">
      <div class="px-4 py-3 rounded-2xl bg-white/10 border border-white/15 backdrop-blur">
        <p class="text-[12px] text-white/80 font-semibold">Ya usaste tu giro 🎀</p>
        <p id="lastPrize" class="text-[13px] text-[#ffc2e3] font-black mt-1"></p>
        <a id="moreSpinsBtn" href="https://wa.me/527772135931?text=Hola%20Yulliza%20%E2%99%A1%20ya%20us%C3%A9%20mi%20giro%20en%20La%20Ruleta%20de%20Yulliza%20y%20quiero%20m%C3%A1s%20giros%20%F0%9F%99%8F" target="_blank" class="mt-3 inline-flex w-full justify-center py-2.5 rounded-full bg-[#25D366] text-white font-bold text-[13px] tracking-wide shadow-[0_4px_14px_rgba(37,211,102,0.4)] hover:bg-[#20bd5a] transition-colors">
          Pedir más giros por WhatsApp
        </a>
      </div>
    </div>
  </div>

  <div class="relative z-10 mt-auto pt-8 text-[10px] text-white/25 tracking-widest">YULLIZA • RULETA ROSITA • <span id="year"></span></div>

  <!-- Modal Ganador -->
  <div id="winnerModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div id="modalBackdrop" class="absolute inset-0 bg-[#0e0a14]/80 backdrop-blur-[14px]"></div>
    <div id="confetti" class="pointer-events-none absolute inset-0 overflow-hidden"></div>
    <div class="relative w-full max-w-[380px] rounded-[28px] bg-gradient-to-br from-white via-[#fff0f8] to-[#ffc2e3] p-[2px] shadow-[0_20px_80px_rgba(255,42,138,0.45)]" style="animation:pop 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards">
      <div class="rounded-[26px] bg-gradient-to-br from-white to-[#fff2f8] px-6 py-7 sm:px-8 sm:py-8 flex flex-col items-center text-center relative overflow-hidden">
        <div class="absolute -top-16 left-1/2 -translate-x-1/2 w-[180%] h-[120px] bg-gradient-to-b from-[#ff8ec8]/30 to-transparent blur-[20px]"></div>
        <div class="relative"><div class="text-[42px] leading-none" style="animation:floatBadge 1.6s ease-in-out infinite">🎀</div></div>
        <h2 class="mt-3 text-[28px] font-black tracking-tight text-[#5a102e]">¡FELICIDADES!</h2>
        <div class="mt-1 h-[3px] w-12 rounded-full bg-gradient-to-r from-[#ff8ec8] to-[#ff2a8a]"></div>
        <p class="mt-5 text-[13px] font-semibold tracking-[0.14em] text-[#a14a75]">¡GANASTE:</p>
        <div id="prizeBadge" class="mt-2 px-5 py-3 rounded-full bg-[#5a102e] text-white font-black text-[16px] sm:text-[18px] tracking-wide shadow-[0_6px_18px_rgba(90,16,46,0.35)] border border-white/20"></div>
        <p class="mt-4 text-[12px] leading-5 text-[#8a4a68] max-w-[280px]">Tu premio está 100% garantizado. La flecha marcó exactamente este segmento.</p>
        
        <div class="mt-6 w-full flex flex-col gap-3">
          <a id="claimBtn" href="#" target="_blank" class="w-full py-[13px] rounded-full bg-[#25D366] text-white font-black text-[13px] tracking-widest shadow-[0_6px_20px_rgba(37,211,102,0.45)] active:scale-[0.98] transition-transform text-center">
            RECLAMAR POR WHATSAPP ♡
          </a>
          <button id="closeBtn" class="w-full py-[13px] rounded-full bg-white border border-[#ffb3dc] text-[#5a102e] font-bold text-[13px] tracking-widest hover:bg-[#fff0f8] active:scale-[0.98] transition-all">
            CERRAR
          </button>
          <a href="https://wa.me/527772135931?text=Hola%20Yulliza%20%E2%99%A1%20quiero%20m%C3%A1s%20giros%20en%20La%20Ruleta%20de%20Yulliza%20%F0%9F%8E%80" target="_blank" class="mt-1 inline-flex items-center justify-center gap-2 text-[11px] font-semibold text-[#5a102e]/60 hover:text-[#ff2a8a] transition-colors">
            ¿Quieres más giros? Pide aquí
          </a>
        </div>

        <div class="mt-5 flex items-center gap-2 text-[10px] font-mono text-[#a14a75]/60">
          <span>verificado</span>
          <span id="debugInfo" class="px-2 py-0.5 rounded bg-[#ff8ec8]/20 text-[#5a102e]/70"></span>
        </div>
      </div>
    </div>
  </div>

<script>
const prizes = ["Paquete de fotos","Paquete de videos","Videollamada 10min","Vuelve a girar","Sigue participando"];
const colors = ["#ff8ec8","#ff5ab0","#ffc2e3","#ff2a8a","#ffb3dc"];
const textColors = ["#5a102e","#fff0f8","#5a1030","#ffffff","#5a102e"];
const segmentAngle = 360 / prizes.length; // 72
const firstStart = -90 - segmentAngle/2; // Para que el segmento 0 quede centrado arriba

let currentRotation = 0;
let isSpinning = false;
let winnerIndex = null;
const WHATSAPP_NUMBER = "527772135931";

const wheel = document.getElementById('wheel');
const segmentsGroup = document.getElementById('segments');
const labelsGroup = document.getElementById('labels');
const spinBtn = document.getElementById('spinBtn');
const spinText = document.getElementById('spinText');
const winnerModal = document.getElementById('winnerModal');
const prizeBadge = document.getElementById('prizeBadge');
const claimBtn = document.getElementById('claimBtn');
const closeBtn = document.getElementById('closeBtn');
const modalBackdrop = document.getElementById('modalBackdrop');
const usedMessage = document.getElementById('usedMessage');
const lastPrizeEl = document.getElementById('lastPrize');
const debugInfo = document.getElementById('debugInfo');
const confettiContainer = document.getElementById('confetti');

document.getElementById('year').textContent = new Date().getFullYear();

// Util: polar to cartesian
function polarToCart(angleDeg, radius){
  const rad = angleDeg * Math.PI / 180;
  return {x: 200 + radius * Math.cos(rad), y: 200 + radius * Math.sin(rad)};
}

// Dibujar ruleta con coincidencia exacta
function drawWheel(highlightIdx = null){
  segmentsGroup.innerHTML = '';
  labelsGroup.innerHTML = '';
  prizes.forEach((prize, i)=>{
    const start = firstStart + i * segmentAngle;
    const end = start + segmentAngle;
    const startP = polarToCart(start, 185);
    const endP = polarToCart(end, 185);
    const largeArc = segmentAngle > 180 ? 1 : 0;
    const isWinner = highlightIdx === i;
    
    // Segmento
    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d", `M 200 200 L ${startP.x} ${startP.y} A 185 185 0 ${largeArc} 1 ${endP.x} ${endP.y} Z`);
    path.setAttribute("fill", colors[i]);
    path.setAttribute("stroke", "white");
    path.setAttribute("stroke-width", isWinner ? "4" : "2");
    path.setAttribute("stroke-linejoin","round");
    if(isWinner) path.setAttribute("filter","url(#winGlow)");
    path.style.transition = "stroke-width 0.3s, filter 0.3s";
    segmentsGroup.appendChild(path);

    // Borde interior sutil
    const inner = document.createElementNS("http://www.w3.org/2000/svg","path");
    inner.setAttribute("d", `M 200 200 L ${startP.x} ${startP.y} A 185 185 0 ${largeArc} 1 ${endP.x} ${endP.y} Z`);
    inner.setAttribute("fill","none");
    inner.setAttribute("stroke","white");
    inner.setAttribute("stroke-opacity", isWinner ? "0.9" : "0.35");
    inner.setAttribute("stroke-width", isWinner ? "1.5" : "0.8");
    segmentsGroup.appendChild(inner);

    // Label
    const mid = start + segmentAngle/2;
    const labelPos = polarToCart(mid, 115);
    const g = document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("transform", `translate(${labelPos.x}, ${labelPos.y}) rotate(${mid+90})`);
    
    const text = document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("text-anchor","middle");
    text.setAttribute("dominant-baseline","central");
    text.setAttribute("fill", textColors[i]);
    text.setAttribute("font-size", isWinner ? "14" : "13");
    text.setAttribute("font-weight","800");
    text.setAttribute("letter-spacing","0.2");
    if(isWinner) text.style.filter = "drop-shadow(0 0 6px white)";
    text.style.paintOrder = "stroke";
    text.style.stroke = "rgba(255,255,255,0.55)";
    text.style.strokeWidth = textColors[i] === "#ffffff" ? "0.3px" : "0";
    text.style.strokeLinejoin = "round";

    // Si el texto es largo, dividir
    const words = prize.split(" ");
    if(prize.length > 12 && words.length > 1){
      const first = words.slice(0,-1).join(" ");
      const last = words[words.length-1];
      const tspan1 = document.createElementNS("http://www.w3.org/2000/svg","tspan");
      tspan1.setAttribute("x","0");
      tspan1.setAttribute("dy","-0.55em");
      tspan1.textContent = first;
      const tspan2 = document.createElementNS("http://www.w3.org/2000/svg","tspan");
      tspan2.setAttribute("x","0");
      tspan2.setAttribute("dy","1.15em");
      tspan2.textContent = last;
      text.appendChild(tspan1);
      text.appendChild(tspan2);
    } else {
      text.textContent = prize;
    }
    g.appendChild(text);
    labelsGroup.appendChild(g);
  });

  // Dots alrededor
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  for(let i=0;i<12;i++){
    const ang = i * 360/12;
    const pos = polarToCart(ang, 205);
    const dot = document.createElement('div');
    dot.className = "absolute w-2 h-2 bg-white rounded-full shadow-[0_0_6px_white]";
    dot.style.left = `${pos.x/400*100}%`;
    dot.style.top = `${pos.y/400*100}%`;
    dot.style.transform = "translate(-50%,-50%)";
    dots.appendChild(dot);
  }
}

function getWinnerIndex(finalAngle){
  // Puntero en 270 deg (arriba)
  const pointer = 270;
  // Angulo local que quedó arriba
  let local = (pointer - (finalAngle % 360) + 360*10) % 360;
  // Normalizar respecto a firstStart
  let normalized = (local - firstStart + 360*10) % 360;
  // Si está muy cerca de 360, es 0
  if(normalized >= 360 - 0.0001) normalized = 0;
  let idx = Math.floor(normalized / segmentAngle);
  idx = ((idx % prizes.length) + prizes.length) % prizes.length;
  return {idx, local, normalized, mod: finalAngle % 360};
}

function launchConfetti(){
  confettiContainer.innerHTML = '';
  const cols = ["#ff8ec8","#ff5ab0","#ffc2e3","#ffffff","#ffb3dc"];
  for(let i=0;i<32;i++){
    const el = document.createElement('div');
    const left = Math.random()*100;
    const delay = Math.random()*0.8;
    const duration = 2.5 + Math.random()*2;
    const size = 8 + Math.random()*10;
    const color = cols[i % cols.length];
    const isCircle = Math.random() > 0.5;
    el.style.position = "absolute";
    el.style.left = `${left}%`;
    el.style.top = "-20px";
    el.style.width = `${size}px`;
    el.style.height = isCircle ? `${size}px` : `${size*1.6}px`;
    el.style.background = color;
    el.style.borderRadius = isCircle ? "50%" : "2px";
    el.style.animation = `fall ${duration}s linear ${delay}s forwards`;
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    el.style.boxShadow = `0 0 6px ${color}`;
    confettiContainer.appendChild(el);
  }
}

function spin(){
  if(isSpinning) return;
  // Verificar si ya giró
  if(localStorage.getItem('yulliza_spin_used') === 'true'){
    showUsed();
    return;
  }

  isSpinning = true;
  spinText.textContent = "GIRANDO...";
  spinBtn.disabled = true;

  const extraRotations = 5 + Math.random()*4; // 5 a 9 vueltas
  const extraDeg = Math.random()*360;
  const target = currentRotation + extraRotations*360 + extraDeg;

  wheel.style.transition = "transform 4s cubic-bezier(0.15,0.85,0.25,1)";
  wheel.style.transform = `rotate(${target}deg)`;

  const result = getWinnerIndex(target);
  winnerIndex = result.idx;

  console.log(`%c[YULLIZA] finalAngle:${target.toFixed(2)} mod:${result.mod.toFixed(2)} local:${result.local.toFixed(2)} norm:${result.normalized.toFixed(2)} idx:${result.idx} premio:${prizes[result.idx]}`, "color:#ff5ab0;font-weight:bold");

  setTimeout(()=>{
    isSpinning = false;
    currentRotation = target;
    drawWheel(winnerIndex);
    
    // Guardar en localStorage - solo un giro por cliente
    localStorage.setItem('yulliza_spin_used','true');
    localStorage.setItem('yulliza_prize', prizes[winnerIndex]);
    localStorage.setItem('yulliza_prize_index', winnerIndex);
    localStorage.setItem('yulliza_date', new Date().toISOString());

    // Mostrar modal con premio coincidente
    prizeBadge.textContent = prizes[winnerIndex] + "!";
    const waText = `¡Hola Yulliza ♡! Gané ${prizes[winnerIndex]} en La Ruleta de Yulliza 🎀✨ Quiero reclamar mi premio`;
    claimBtn.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(waText)}`;
    
    debugInfo.textContent = `mod:${result.mod.toFixed(1)}° → idx:${result.idx}`;
    
    winnerModal.classList.remove('hidden');
    launchConfetti();
    showUsed(); // actualizar UI de usado
  }, 4100);
}

function showUsed(){
  const used = localStorage.getItem('yulliza_spin_used') === 'true';
  if(used){
    spinBtn.classList.add('hidden');
    usedMessage.classList.remove('hidden');
    const prize = localStorage.getItem('yulliza_prize');
    if(prize){
      lastPrizeEl.textContent = `Ganaste: ${prize}`;
      spinText.textContent = "YA GIRASTE";
    }
    // Botón de más giros
    const moreBtn = document.getElementById('moreSpinsBtn');
    const waMore = `Hola Yulliza ♡ ya usé mi giro en La Ruleta de Yulliza y gané ${prize || ''}. Quiero más giros 🙏🎀`;
    moreBtn.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(waMore)}`;
  }
}

function closeModal(){
  winnerModal.classList.add('hidden');
}

// Eventos
spinBtn.addEventListener('click', spin);
closeBtn.addEventListener('click', closeModal);
modalBackdrop.addEventListener('click', closeModal);

// Inicializar
drawWheel();
showUsed();

// Prevenir trampa: deshabilitar si ya giró
if(localStorage.getItem('yulliza_spin_used') === 'true'){
  spinBtn.disabled = true;
  spinText.textContent = "YA USASTE TU GIRO";
}
</script>
</body>
</html>
